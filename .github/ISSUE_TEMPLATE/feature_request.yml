name: 💡 功能建议
description: 提出新功能、统计指标或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前可先浏览 [Wiki](https://github.com/ShunCai/QZoneExport/wiki) 与已有 issue，避免重复。
        请说明**使用场景**而不只是「加个按钮」——例如「想在分享截图时快速看出哪几年没更新过」。

  - type: dropdown
    id: area
    attributes:
      label: 建议涉及
      options:
        - 备份能力（新模块 / 新字段 / 增量策略）
        - 媒体下载（新下载器 / 重试 / 去重）
        - 离线查看器（新统计 / 新视图 / 交互）
        - 性能与大数据量
        - 隐私与分享
        - 文档 / 构建 / 发布
        - 其他
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 场景与痛点
      description: 你现在怎么做的？哪里不方便？涉及的数据量大概多少？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果
      description: 描述最终看到的样子；如有参考页面/截图可附上
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，确认不是重复建议
          required: true
